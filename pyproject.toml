[project]
name = "rejestr-io-mcp"
version = "0.1.0"
description = "MCP server exposing the rejestr.io API (Polish KRS, CRBR, financial statements)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27",
    "cachetools>=5.3",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
rejestr-io-mcp = "rejestr_io_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pyinstaller>=6.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rejestr_io_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
